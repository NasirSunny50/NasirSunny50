name: Profile metrics

# Renders the profile stat cards as SVGs and commits them into assets/.
# The cards are then served from this repository instead of a shared public
# instance, so they cannot be rate-limited away.

on:
  schedule:
    - cron: "17 3 * * *"     # daily, 03:17 UTC (09:17 Asia/Dhaka)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  # The three jobs commit to the same branch, so they run one after another
  # rather than racing each other for the push.
  overview:
    name: Overview card
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: NasirSunny50
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
          config_display: large

  languages:
    name: Languages card
    needs: overview
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: NasirSunny50
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

  activity:
    name: Contributions calendar card
    needs: languages
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: NasirSunny50
          filename: assets/metrics.activity.svg
          base: ""
          config_timezone: Asia/Dhaka
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
